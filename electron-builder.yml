appId: com.domestiquesolutions.teamspwalauncher
productName: Teams PWA Launcher
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  target:
    - nsis
    - portable
  icon: icon.ico
  executableName: TeamsPWALauncher
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Teams PWA Launcher
  uninstallDisplayName: Teams PWA Launcher
  artifactName: ${name}-${version}-setup.${ext}
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  category: public.app-category.business
  icon: icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extendInfo:
    NSCameraUsageDescription: Teams PWA Launcher uses the camera for Microsoft Teams calls.
    NSMicrophoneUsageDescription: Teams PWA Launcher uses the microphone for Microsoft Teams calls.
    NSAudioCaptureUsageDescription: Teams PWA Launcher captures audio for Microsoft Teams calls.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: icons
  syncDesktopName: true
  maintainer: Domestique Solutions
  category: Network
  synopsis: Switch between multiple Microsoft Teams accounts
  description: A single application that hosts isolated Microsoft Teams web profiles so you do not need a separate PWA per account.
  executableName: teams-pwa-launcher
  artifactName: ${name}-${version}.${ext}
  desktop:
    entry:
      Name: Teams PWA Launcher
      Comment: Switch between multiple Microsoft Teams accounts
      Categories: Network;InstantMessaging;Office;
      StartupWMClass: teams-pwa-launcher
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
